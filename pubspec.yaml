name: quizbaaz
description: "🚀 QuizBaaz 3D - A Gamified Flutter Quiz & Learning Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Ships the Material/Cupertino translations (date pickers, "Cancel" in system
  # dialogs, text-selection menus) for bn/hi. Our own copy lives in lib/l10n/.
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  audioplayers: ^6.0.0
  confetti: ^0.7.0
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  google_sign_in: ^7.2.0
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.8.0
  # Admin content images (avatars, shop art) are uploaded here under the
  # caller's own Firebase Auth + storage rules. No upload secret is held by
  # the client — the old ImgBB API key was removed (docs/SECURITY_P0_FIXES.md).
  firebase_storage: ^13.0.0
  # Trusted backend callables (setAdmin, submitDailyResult, purchaseItem,
  # resolveBattle) — see /functions. Fail-soft when not deployed.
  cloud_functions: ^6.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.0
  image_picker: ^1.0.7
  # Opens external links (privacy policy, terms, Play Store) from the
  # Profile screen, and the system share sheet for "Share with Friends".
  url_launcher: ^6.3.1
  share_plus: ^10.1.0
  # AdMob — banner + interstitial. Runs on official Google test ad unit IDs
  # until the real IDs from the AdMob console are pasted into
  # lib/core/constants/ad_config.dart (see the "HOW TO GO LIVE" note there).
  google_mobile_ads: ^9.1.0
  # SHA-1 for question fingerprints (duplicate detection).
  crypto: ^3.0.3
  # OS-scheduled Daily Quiz reminders (no FCM). See docs/15.
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^4.1.1
  # Live push via OneSignal (FCM under the hood). See docs/16.
  onesignal_flutter: ^5.3.4
  # Firestore-backed pool of LLM API keys with failover, cooldowns and an admin
  # screen. Powers the AI question generator; see docs/11.
  admin_api_key_manager:
    git:
      url: https://github.com/Keshab1997/admin_api_key_manager
      ref: master

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/data/questions/
    - assets/icons/
    - assets/images/
    - assets/images/characters/
    - assets/images/avatars/
    - assets/sounds/
