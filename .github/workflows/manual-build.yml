name: Build Android APK or AAB (Manual)

# Actions -> Manual Android Build -> Run workflow. AAB requires signing secrets.
on:
  workflow_dispatch:
    inputs:
      format:
        description: Which Android file should be built?
        required: true
        type: choice
        options:
          - apk
          - aab
        default: apk

permissions:
  contents: read

jobs:
  build:
    uses: Keshab1997/flutter-builder/.github/workflows/flutter-build.yml@v1.13.0
    with:
      flutter-channel: stable
      working-directory: "."
      build-apk: ${{ inputs.format == 'apk' }}
      build-aab: ${{ inputs.format == 'aab' }}
      artifact-retention-days: 14
    # inherit (not an explicit list): the builder also needs
    # GOOGLE_SERVICES_JSON_BASE64 to write android/app/google-services.json
    # before the build — the explicit list missed it and the release build
    # failed at :app:processReleaseGoogleServices.
    secrets: inherit
