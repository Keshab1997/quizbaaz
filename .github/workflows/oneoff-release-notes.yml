name: One-off — release notes for 1.0.20

# Temporary workflow: bumps the version and writes the 1.0.20 release notes in
# all the places the repo keeps them, then commits. Dispatched once, then
# deleted. It exists so the two large files (store_listing/whats_new.yaml and
# whats_new_catalog.dart) are edited by exact, asserted insertions instead of
# being retyped by hand.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oneoff-release-notes
  cancel-in-progress: false

jobs:
  notes:
    name: write the 1.0.20 release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump the version and write the notes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          VERSION = '1.0.20'
          BUILD = 21

          notes = {
              'en': {
                  'header': "What's new in 1.0.20:",
                  'bullets': [
                      'New subject — Chhaya Prakashani — with 1,200+ fresh questions in Physics, Chemistry and Biology.',
                      'Daily Quiz: the competition set for the day is now always ready, so your score always reaches the leaderboard.',
                      'New questions and subjects now arrive automatically from the admin panel.',
                      'Removed the Dark Mode toggle in Profile — it had no effect; the app is always in dark mode.',
                  ],
              },
              'bn': {
                  'header': 'QuizBaaz ১.০.২০-এ যা নতুন:',
                  'bullets': [
                      'নতুন সাবজেক্ট — ছায়া প্রকাশনী — পদার্থ, রসায়ন ও জীববিজ্ঞানে ১,২০০+ নতুন প্রশ্ন।',
                      'ডেইলি কুইজ: দিনের প্রতিযোগিতার সেট এখন সবসময় প্রস্তুত, তাই আপনার স্কোর সবসময় লিডারবোর্ডে পৌঁছাবে।',
                      'নতুন প্রশ্ন ও সাবজেক্ট এখন অ্যাডমিন প্যানেল থেকে নিজে থেকেই চলে আসে।',
                      'প্রোফাইল থেকে ডার্ক মোড অপশন সরানো হয়েছে — এটি কোনো কাজ করত না; অ্যাপ সবসময় ডার্ক মোডে থাকে।',
                  ],
              },
              'hi': {
                  'header': 'QuizBaaz 1.0.20 में नया:',
                  'bullets': [
                      'नया विषय — Chhaya Prakashani — भौतिकी, रसायन और जीव विज्ञान में 1,200+ नए प्रश्न।',
                      'डेली क्विज़: दिन का प्रतियोगिता सेट अब हमेशा तैयार रहता है, इसलिए आपका स्कोर हमेशा लीडरबोर्ड तक पहुँचता है।',
                      'नए प्रश्न और विषय अब एडमिन पैनल से अपने आप आ जाते हैं।',
                      'प्रोफ़ाइल से डार्क मोड विकल्प हटा दिया गया — उसका कोई असर नहीं था; ऐप हमेशा डार्क मोड में रहता है।',
                  ],
              },
          }

          # 1) pubspec.yaml — the version name and build number.
          p = Path('pubspec.yaml')
          s = p.read_text(encoding='utf-8')
          assert s.count('version: 1.0.19+20\n') == 1, 'pubspec version line not found'
          p.write_text(
              s.replace('version: 1.0.19+20\n', f'version: {VERSION}+{BUILD}\n'),
              encoding='utf-8')

          # 2) store_listing/whats_new.yaml — current + a new release block.
          p = Path('store_listing/whats_new.yaml')
          s = p.read_text(encoding='utf-8')
          assert s.count('current: "1.0.19"') == 1, 'whats_new current not found'
          s = s.replace('current: "1.0.19"', f'current: "{VERSION}"')
          block = f'  "{VERSION}":\n'
          for lang in ('en', 'bn', 'hi'):
              block += f'    {lang}: |-\n'
              block += f'      {notes[lang]["header"]}\n'
              block += '\n'
              for bullet in notes[lang]['bullets']:
                  block += f'      • {bullet}\n'
          assert s.count('releases:\n') == 1, 'releases: anchor not found'
          s = s.replace('releases:\n', 'releases:\n' + block, 1)
          p.write_text(s, encoding='utf-8')

          # 3) lib/data/services/whats_new_catalog.dart — the in-app dialog.
          p = Path('lib/data/services/whats_new_catalog.dart')
          s = p.read_text(encoding='utf-8')
          anchor = '  static const Map<String, Map<String, List<String>>> _releases = {\n'
          assert s.count(anchor) == 1, 'catalog anchor not found'
          entry = f"    '{VERSION}': {{\n"
          for lang in ('en', 'bn', 'hi'):
              entry += f"      '{lang}': [\n"
              for bullet in notes[lang]['bullets']:
                  entry += f"        '{bullet}',\n"
              entry += '      ],\n'
          entry += '    },\n'
          s = s.replace(anchor, anchor + entry, 1)
          p.write_text(s, encoding='utf-8')

          # 4) distribution/whatsnew/whatsnew-<locale> — what the Play upload sends.
          for locale, lang in (('en-US', 'en'), ('bn-BD', 'bn'), ('hi-IN', 'hi')):
              body = '\n'.join('• ' + b for b in notes[lang]['bullets'])
              Path(f'distribution/whatsnew/whatsnew-{locale}').write_text(
                  notes[lang]['header'] + '\n\n' + body + '\n', encoding='utf-8')

          print(f'release notes written for {VERSION}+{BUILD}')
          PY

      - name: Commit the release notes
        run: |
          set -euo pipefail
          git config user.name "quizbaaz-sync[bot]"
          git config user.email "quizbaaz-sync@users.noreply.github.com"
          git add -- pubspec.yaml store_listing/whats_new.yaml \
            lib/data/services/whats_new_catalog.dart distribution/whatsnew
          git commit -m "chore(release): bump version to 1.0.20+21 and write release notes"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
