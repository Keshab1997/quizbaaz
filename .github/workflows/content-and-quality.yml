name: Content & Quality

# Jobs:
#   quality       — analyze, test and validate the banks on every push/PR
#                   (no secrets, safe for fork pull requests)
#   rules-matrix  — the firestore.rules matrix against the emulator
#
# The Firestore → bundle content sync lives in its own workflow
# (`sync-content.yml`): it registers new subjects/chapters, applies the deletion
# registry, pulls new questions and commits the result to main. This file no
# longer carries a refresh job of its own — two automations doing the same pull
# would fight (one opened a PR, the other committed).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 02:30 UTC = 08:00 IST
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: analyze · test · validate banks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Question banks are valid
        run: python3 tool/validate_questions.py --strict

      # Needs a service account, so it only runs where secrets exist —
      # on the weekly schedule or an explicit manual run, not on fork PRs.
      - name: Bundled banks are current (Firestore drift check)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          FIREBASE_READONLY_SA: ${{ secrets.FIREBASE_READONLY_SA }}
        run: |
          if [ -z "$FIREBASE_READONLY_SA" ]; then
            echo "::notice::FIREBASE_READONLY_SA is not set — skipping the drift check."
            exit 0
          fi
          pip install --quiet google-cloud-firestore
          printf '%s' "$FIREBASE_READONLY_SA" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          python3 tool/pull_firestore_questions.py --check

  # The Firestore emulator is the only place where firestore.rules can be
  # checked without a live project: it answers queries exactly as production
  # does (rules are not filters), which is what proves the participant-scoped
  # challenge/room queries in R17 work — and that an unscoped one is denied.
  #
  # Runs on every push/PR; needs the emulator (Firebase CLI + JDK 21), not the
  # Flutter toolchain.
  rules-matrix:
    name: firestore rules matrix (emulator)
    runs-on: ubuntu-latest
    # The emulator is a background process: never let a stuck port wait hold
    # the whole run open for hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the rules test dependencies
        working-directory: tool/security
        run: npm install --no-audit --no-fund

      - name: Rules matrix (starts the Firestore emulator)
        working-directory: tool/security
        run: npm test
