name: Content & Quality

# Two jobs:
#   quality                — analyze, test and validate the banks on every push/PR
#                            (no secrets, safe for fork pull requests)
#   refresh-question-bank  — weekly, copy the admin's Firestore questions into the
#                            bundled banks and open a PR when they moved

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 02:30 UTC = 08:00 IST
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: analyze · test · validate banks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Question banks are valid
        run: python3 tool/validate_questions.py

      # Needs a service account, so it only runs where secrets exist —
      # on the weekly schedule or an explicit manual run, not on fork PRs.
      - name: Bundled banks are current (Firestore drift check)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          FIREBASE_READONLY_SA: ${{ secrets.FIREBASE_READONLY_SA }}
        run: |
          if [ -z "$FIREBASE_READONLY_SA" ]; then
            echo "::notice::FIREBASE_READONLY_SA is not set — skipping the drift check."
            exit 0
          fi
          pip install --quiet google-cloud-firestore
          printf '%s' "$FIREBASE_READONLY_SA" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          python3 tool/pull_firestore_questions.py --check

  # The Firestore emulator is the only place where firestore.rules can be
  # checked without a live project: it answers queries exactly as production
  # does (rules are not filters), which is what proves the participant-scoped
  # challenge/room queries in R17 work — and that an unscoped one is denied.
  #
  # Runs on every push/PR; needs the emulator (Firebase CLI + JDK 21), not the
  # Flutter toolchain.
  rules-matrix:
    name: firestore rules matrix (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the rules test dependencies
        working-directory: tool/security
        run: npm install --no-audit --no-fund

      - name: Rules matrix (starts the Firestore emulator)
        working-directory: tool/security
        run: npm test

  refresh-question-bank:
    name: pull admin questions into the bundle
    # Deliberately NOT `needs: quality`: a failing widget test must not block the
    # weekly content refresh. This job only opens a PR, where `quality` runs again.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the Firestore client
        run: pip install google-cloud-firestore

      - name: Write the read-only service account
        env:
          FIREBASE_READONLY_SA: ${{ secrets.FIREBASE_READONLY_SA }}
        run: |
          if [ -z "$FIREBASE_READONLY_SA" ]; then
            echo "::error::Add the secret FIREBASE_READONLY_SA (Settings → Secrets and variables → Actions → New repository secret) with the JSON of a read-only service account."
            exit 1
          fi
          printf '%s' "$FIREBASE_READONLY_SA" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Check the service account against Firestore
        # Prints which project/account the secret holds and how many questions
        # are readable — the clearest evidence that FIREBASE_READONLY_SA is right.
        run: python3 tool/check_service_account.py "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Pull questions from Firestore
        run: python3 tool/pull_firestore_questions.py --update-catalog-counts

      - name: Validate what we just wrote
        run: python3 tool/validate_questions.py

      - name: Open a pull request when the banks moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "Bundled banks already match Firestore — nothing to do."
            exit 0
          fi

          BRANCH=chore/refresh-question-bank
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "content: refresh bundled question banks from Firestore" \
                     -m "Generated by tool/pull_firestore_questions.py. Review that question ids, options and translations look right before merging."
          git push --force origin "$BRANCH"

          if [ "$(gh pr list --head "$BRANCH" --json number --jq 'length')" = "0" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "content: refresh bundled question banks from Firestore" \
              --body "$(printf '%s\n' \
                'Automated refresh of `assets/data/questions/*.json` from the admin panel'"'"'s Firestore question banks.' \
                '' \
                'This is what puts newly authored questions into the **offline** copy of the app.' \
                'Nothing is deleted: the pull merges by id, Firestore winning on a clash.' \
                '' \
                'Checklist before merging:' \
                '- [ ] `flutter analyze` / `flutter test` are green on this branch' \
                '- [ ] `python3 tool/validate_questions.py` passes' \
                '- [ ] spot-check one bank in the Files changed tab' \
                '' \
                'See `docs/19_FIRESTORE_TO_BUNDLE_PULL.md`.')"
          else
            echo "A refresh PR is already open — the push above updated it."
          fi
