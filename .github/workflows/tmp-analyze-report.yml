name: tmp analyze report

# TEMPORARY — deletes itself once the static-analysis failure is fixed.
# Runs `flutter analyze` and posts the output as a PR comment, because the
# sandbox cannot download Actions logs (blob storage is unreachable).

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze:
    name: analyze report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          set +e
          flutter analyze > analyze.txt 2>&1
          echo "analyze exit: $?"
          tail -c 40000 analyze.txt > analyze-tail.txt
          wc -l analyze.txt

      - name: Post the output on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment 26 --repo Keshab1997/quizbaaz --body-file analyze-tail.txt
