# Source of truth for Play Console release notes AND the in-app "What's new"
# dialog. Keep each language ≤ 500 characters (Play limit).
#
# On every version bump: add a `releases.<version>` block (en / bn / hi),
# set `current` to that version, then publish the AAB with
#   python3 tool/publish_play.py --aab app.aab --track alpha
# which reads this file automatically. `--release-note` overrides English only.

current: "1.0.11"

releases:
  "1.0.11":
    en: |-
      • Daily quiz: your FIRST run of the day is your leaderboard score — later runs can't change it
      • A Score Shield now buys one retry that replaces today's score
      • Quiz and result screens tell you up front whether a run will count
      • Today's competition packet now publishes automatically every day
    bn: |-
      • ডেইলি কুইজ: দিনের প্রথম রানই আপনার লিডারবোর্ড স্কোর — পরের রান তা বদলাতে পারবে না
      • স্কোর শিল্ড এখন একটা রিট্রি দেয়, যা আজকের স্কোর বদলে দেয়
      • কুইজ ও রেজাল্ট স্ক্রিন আগেই জানিয়ে দেয় — এই রান কাউন্ট হবে কি না
      • আজকের প্রতিযোগিতার প্যাকেট এখন প্রতিদিন নিজে থেকেই প্রকাশ হয়
    hi: |-
      • डेली क्विज़: दिन की पहली रन ही आपका लीडरबोर्ड स्कोर — बाद की रन उसे नहीं बदल सकतीं
      • स्कोर शील्ड अब एक रिट्राय देती है जो आज का स्कोर बदल देती है
      • क्विज़ और रिज़ल्ट स्क्रीन पहले ही बताती हैं कि यह रन गिनी जाएगी या नहीं
      • आज का कॉम्पिटीशन पैकेट अब हर दिन अपने आप पब्लिश होता है
  "1.0.7":
    en: |-
      • Google Sign-In no longer fails silently on Play builds
      • Clear error if Play App Signing SHA-1 is missing in Firebase
    bn: |-
      • Play বিল্ডে Google Sign-In আর চুপচাপ ফেল করবে না
      • Firebase-এ Play SHA-1 না থাকলে স্পষ্ট এরর দেখাবে
    hi: |-
      • Play बिल्ड पर Google Sign-In अब चुपचाप फेल नहीं होगा
      • Firebase में Play SHA-1 न हो तो साफ़ त्रुटि दिखेगी
  "1.0.6":
    en: |-
      • Google Sign-In fixed on Play Closed testing (Web client ID + ID token)
      • Add both Play App Signing and upload-key SHA-1 in Firebase
      • Profile and splash show the real app version
    bn: |-
      • Play Closed testing-এ Google Sign-In ঠিক করা হয়েছে
      • Firebase-এ App Signing ও upload-key দুটো SHA-1 লাগবে
      • প্রোফাইল ও স্প্ল্যাশে আসল অ্যাপ ভার্সন দেখাবে
    hi: |-
      • Play Closed testing पर Google Sign-In ठीक किया गया
      • Firebase में App Signing और upload-key दोनों SHA-1 जोड़ें
      • प्रोफ़ाइल और स्प्लैश पर असली ऐप वर्शन दिखेगा
  "1.0.5":
    en: |-
      • App now tells you immediately when a new version is installed
      • What's new dialog on first open after an update (EN / বাংলা / हिन्दी)
      • Real version number on splash and Profile
      • Play in-app update prompt so Closed testing testers get the new build without hunting the Store
    bn: |-
      • নতুন ভার্সন ইনস্টল হলে অ্যাপ সাথে সাথে জানাবে
      • আপডেটের পর প্রথমবার খুললে What's new ডায়লগ (EN / বাংলা / हिन्दी)
      • স্প্ল্যাশ ও প্রোফাইলে আসল ভার্সন নম্বর
      • Play ইন-অ্যাপ আপডেট — Closed testing টেস্টাররা Store খুঁজে না পেয়েও নতুন বিল্ড পাবেন
    hi: |-
      • नया वर्शन इंस्टॉल होते ही ऐप तुरंत बताएगा
      • अपडेट के बाद पहली बार खोलने पर What's new डायलॉग (EN / বাংলা / हिन्दी)
      • स्प्लैश और प्रोफ़ाइल पर असली वर्शन नंबर
      • Play इन-ऐप अपडेट — Closed testing टेस्टर स्टोर खोजे बिना नया बिल्ड पाएँगे
