# Source of truth for Play Console release notes AND the in-app "What's new"
# dialog. Keep each language ≤ 500 characters (Play limit).
#
# On every version bump: add a `releases.<version>` block (en / bn / hi),
# set `current` to that version, then publish the AAB with
#   python3 tool/publish_play.py --aab app.aab --track alpha
# which reads this file automatically. `--release-note` overrides English only.

current: "1.0.30"

releases:
  "1.0.30":
    en: |-
      What's new in 1.0.30:

      • Better stability on low-memory phones — question banks now load without freezing the quiz or battle screen, even on 2 GB devices.
      • Fewer crashes when many chapters refresh at once; offline play and your progress work exactly as before.
    bn: |-
      QuizBaaz ১.০.৩০-এ যা নতুন:

      • কম-মেমরির ফোনে স্থায়িত্ব বাড়েছে — প্রশ্ন ব্যাংক এখন কুইজ বা ব্যাটল স্ক্রিন ফ্রিজ না করেই লোড হয়।
      • অনেক chapter একসাথে আপডেট হলেও ক্রাশের সম্ভাবনা কমেছে; অফলাইন খেলা ও অগ্রগতি আগের মতোই।
    hi: |-
      QuizBaaz 1.0.30 में नया:

      • कम-मेमोरी वाले फ़ोन पर बेहतर स्थिरता — प्रश्न बैंक अब क्विज़ या बैटल स्क्रीन को फ्रीज किए बिना लोड होता है।
      • कई chapters एक साथ अपडेट होने पर क्रैश की संभावना कम; ऑफ़लाइन खेल और प्रगति पहले जैसी ही।
  "1.0.29":
    en: |-
      What's new in 1.0.29:

      • Your progress now backs up properly — purchased items, coins & daily streak sync through a secure server, and come back when you sign in with Google on a new phone.
      • AI Book Buddy asks guests to sign in before an AI call, so your questions and answers are saved.
      • A clear error screen replaces the blank grey box; small security and stability fixes.
    bn: |-
      QuizBaaz ১.০.২৯-এ যা নতুন:

      • অগ্রগতি এখন ঠিকমতো ব্যাকআপ হয় — কেনা আইটেম, কয়েন ও ডেইলি স্ট্রিক নিরাপদ সার্ভারে সিঙ্ক হয়; নতুন ফোনে Google দিয়ে সাইন-ইন করলেই ফিরে পাবেন।
      • AI বুক বাডি এখন গেস্টদের AI কলের আগে সাইন-ইন করতে বলে, যাতে প্রশ্ন ও উত্তর সেভ হয়।
      • ধূসর খালি স্ক্রিনের বদলে স্পষ্ট এরর দেখা যায়; নিরাপত্তা ও স্থায়িত্বের ছোট ঠিকঠাক।
    hi: |-
      QuizBaaz 1.0.29 में नया:

      • प्रगति अब सही तरह से बैकअप होती है — खरीदे गए आइटम, coins और डेली स्ट्रीक सुरक्षित सर्वर पर सिंक होते हैं; नए फ़ोन पर Google से साइन-इन करते ही वापस मिलते हैं।
      • AI बुक बडी अब अतिथियों से AI कॉल से पहले साइन-इन मांगता है, ताकि सवाल और उत्तर सेव हों।
      • ख़ाली ग्रे स्क्रीन के बजाय स्पष्ट त्रुटि; सुरक्षा और स्थिरता के छोटे सुधार।
  "1.0.27":
    en: |-
      What's new in 1.0.27:

      • Admin API keys — premium dashboard with gradient avatars, premium cards & instant Test with spinner (max 8s, shows elapsed)
      • Smarter Admin — form draft & scroll stay after refresh, Undo for delete/bulk, new free-model alerts
      • Free Model Explorer — browse OpenRouter free models, copy id or Get API key in one tap
    bn: |-
      QuizBaaz ১.০.২৭-এ যা নতুন:

      • Admin API Key — প্রিমিয়াম ড্যাশবোর্ড, গ্রেডিয়েন্ট অবতার, প্রিমিয়াম কার্ড ও স্পিনার সহ দ্রুত Test (সর্বোচ্চ ৮s, elapsed দেখায়)
      • আরও স্মার্ট Admin — রিফ্রেশেও ফর্ম ও স্ক্রল মনে থাকে, delete/bulk-এ Undo, নতুন ফ্রি মডেল অ্যালার্ট
      • ফ্রি মডেল এক্সপ্লোরার — OpenRouter-এর ফ্রি মডেল ব্রাউজ করুন, এক ট্যাপে কপি বা Get API key
    hi: |-
      QuizBaaz 1.0.27 में नया:

      • Admin API Keys — प्रीमियम डैशबोर्ड, ग्रेडिएंट अवतार, प्रीमियम कार्ड और स्पिनर के साथ तेज़ Test (अधिकतम 8s, elapsed दिखता है)
      • स्मार्ट Admin — रिफ्रेश के बाद भी फॉर्म और स्क्रॉल याद रहता है, delete/bulk पर Undo, नए फ्री मॉडल अलर्ट
      • फ्री मॉडल एक्सप्लोरर — OpenRouter के फ्री मॉडल ब्राउज़ करें, एक टैप में कॉपी या Get API key
  "1.0.26":
    en: |-
      What's new in 1.0.26:

      • New AI Book Buddy — scan any textbook page or note to get clear explanations, ask follow-up doubts, and play instant MCQ quizzes!
      • Rich Study Reader & Language Choice — formatted study tables, highlight cards, A-/A+ text size, and separate Bangla / English / Hindi AI reply choice.
      • Daily AI Quota Meter — track your free daily AI uses live, while reading saved notes & replaying quizzes stays 100% free offline.
    bn: |-
      QuizBaaz ১.০.২৬-এ যা নতুন:

      • নতুন AI বুক বাডি — বই বা নোটের পাতা স্ক্যান করেই সহজ ব্যাখ্যা পান, যেকোনো প্রশ্ন করুন এবং তাৎক্ষণিক MCQ প্র্যাকটিস কুইজ খেলুন!
      • সুন্দর স্টাডি রিডার ও ভাষা পছন্দ — সাজানো টেবিল, হাইলাইট নোট কার্ড, A-/A+ ফন্ট সাইজ এবং অ্যাপের ভাষা যাই হোক বাংলা / English / हिन्दी-তে AI উত্তর পাওয়ার সুবিধা।
      • ডেইলি AI কোটা মিটার — প্রতিদিনের ফ্রি AI লিমিট লাইভ দেখুন; আর সেভ করা নোট পড়া ও পুরনো কুইজ খেলা অফলাইনে সবসময় ফ্রি।
    hi: |-
      QuizBaaz 1.0.26 में नया:

      • नया AI बुक बडी — किताब या नोट्स का पन्ना स्कैन करें, आसान व्याख्या पाएँ, सवाल पूछें और तुरंत MCQ प्रैक्टिस क्विज़ खेलें!
      • रिच स्टडी रीडर व भाषा चयन — साफ़ स्टडी टेबल, हाइलाइट कार्ड, A-/A+ फ़ॉन्ट साइज़ और अपनी पसंद की বাংলা / English / हिन्दी में AI उत्तर।
      • दैनिक AI कोटा मीटर — आज की मुफ़्त AI सीमा लाइव देखें; सेव किए गए नोट्स पढ़ना और क्विज़ खेलना ऑफ़लाइन हमेशा मुफ़्त।
  "1.0.25":
    en: |-
      What's new in 1.0.25:

      • Yesterday's Daily Quiz Winner alerts — morning reveal & inbox card showing who topped yesterday (plus personalized cards if you finished #1 or Top 10).
      • Smart quiz reminders & streak rescue — morning kickoff, afternoon practice/battle nudges, 7 PM Daily Quiz, and 9:30 PM rescue (auto-muted after you play).
      • Upgraded Notification Inbox with Winner & Challenge badges, direct deep links, and security & stability fixes.
    bn: |-
      QuizBaaz ১.০.২৫-এ যা নতুন:

      • গতকালের ডেইলি কুইজ বিজয়ী অ্যালার্ট — সকালেই জানুন কে প্রথম হয়েছেন, আর আপনি #১ বা টপ-১০ হলে পাবেন বিশেষ অভিনন্দন কার্ড।
      • স্মার্ট কুইজ ও স্ট্রিক রেসকিউ রিমাইন্ডার — সকালের কুইজ, বিকেলের অনুশীলন/ব্যাটল/ভুল রিভিশন, সন্ধ্যা ৭টা ও রাত ৯:৩০ স্ট্রিক বাঁচানোর অ্যালার্ট (খেললেই চুপ)।
      • নতুন নোটিফিকেশন ইনবক্স (বিজয়ী ও চ্যালেঞ্জ ব্যাজ), সরাসরি পেজ ওপেন এবং সিকিউরিটি ও স্থায়িত্ব আপডেট।
    hi: |-
      QuizBaaz 1.0.25 में नया:

      • कल की डेली क्विज़ विजेता अलर्ट — सुबह जानें किसने टॉप किया, और आप #1 या टॉप-10 में आएँ तो ख़ास विजेता कार्ड पाएँ।
      • स्मार्ट क्विज़ व स्ट्रीक रेस्क्यू रिमाइंडर — सुबह क्विज़, दोपहर अभ्यास/बैटल/गलती रिवीज़न, शाम 7 बजे व रात 9:30 स्ट्रीक बचाव अलर्ट (खेलने पर शांत)।
      • नया नोटिफ़िकेशन इनबॉक्स (विजेता और चुनौती बैज), डायरेक्ट लिंक और सुरक्षा व स्थिरता सुधार।
  "1.0.24":
    en: |-
      What's new in 1.0.24:

      • Free Practice — unlimited rounds! Every round draws 10 fresh random questions from the whole bank, or one subject you choose. Play as many times a day as you like — pure revision, nothing is counted.
      • Revision without locks — the new "Revise Chapter" button opens the whole chapter for reading anytime; locked sets can now be revised too. Playing stays in order, reading never waits.
      • Small fixes and polish for a smoother app.
    bn: |-
      QuizBaaz ১.০.২৪-এ যা নতুন:

      • ফ্রি প্র্যাকটিস — অসীম রাউন্ড! প্রতি রাউন্ডে পুরো ব্যাংক থেকে (বা পছন্দের একটি বিষয় থেকে) ১০টি নতুন র‍্যান্ডম প্রশ্ন। দিনে যতবার খুশি খেলুন — শুধু অনুশীলন, কিছুই গোনা হয় না।
      • লক ছাড়া রিভিশন — নতুন "পুরো অধ্যায় রিভিশন" বাটনে যেকোনো সময়ে পুরো অধ্যায় পড়ুন; লক করা সেট এখন পড়া যায়। খেলা সিরিয়ালে, পড়া সব সময়ে খোলা।
      • অ্যাপ আরও মসৃণ করতে ছোটখাটো ঠিকঠাক ও পালিশ।
    hi: |-
      QuizBaaz 1.0.24 में नया:

      • फ्री प्रैक्टिस — अनलिमिटेड राउंड! हर राउंड में पूरे बैंक से (या अपने पसंदीदा विषय से) 10 नए रैंडम सवाल। दिन में जितनी बार चाहें खेलें — बस अभ्यास, कुछ भी गिना नहीं जाता।
      • बिना लॉक रिवाज़ — नए "पूरा अध्याय रिवाज़ करें" बटन से कभी भी पूरा अध्याय पढ़ें; लॉक किए सेट भी अब पढ़े जा सकते हैं। खेलना क्रम में, पढ़ना हमेशा खुला।
      • ऐप को और सहज बनाने के लिए छोटे सुधार और पॉलिश।
  "1.0.23":
    en: |-
      What's new in 1.0.23:

      • Update screen, fixed — when a new update is ready, you now see that update's own notes before you install it, not the previous version's.
      • This very note reached your phone automatically — release notes now publish themselves with every release.
      • Small fixes and polish for a smoother app.
    bn: |-
      QuizBaaz ১.০.২৩-এ যা নতুন:

      • আপডেট স্ক্রিন ঠিক করা হয়েছে — নতুন আপডেট এলেই এবার ইনস্টলের আগেই সেই আপডেটের নিজের নোট দেখতে পাবেন, আগের ভার্সনেরটা নয়।
      • এই নোটটাই তার প্রমাণ — এখন থেকে প্রতিটি রিলিজের নোট নিজে থেকেই আপনার ফোনে পৌঁছে যাবে।
      • অ্যাপ আরও মসৃণ করতে ছোটখাটো ঠিকঠাক ও পালিশ।
    hi: |-
      QuizBaaz 1.0.23 में नया:

      • अपडेट स्क्रीन ठीक की गई — नया अपडेट तैयार होते ही अब इंस्टॉल से पहले उसी अपडेट के नोट दिखेंगे, पिछले वर्शन के नहीं।
      • यह नोट ही इसका सबूत है — अब से हर रिलीज़ के नोट अपने आप आपके फ़ोन तक पहुँचेंगे।
      • ऐप को और सहज बनाने के लिए छोटे सुधार और पॉलिश।
  "1.0.22":
    en: |-
      What's new in 1.0.22:

      • Chapter sets feel smoother — the Start and Revise buttons are now bigger, clearer and easier to tap.
      • Start stands out with a soft glow, while Revise sits calmly beside it — play first, revise anytime.
      • History → Retry matches the same polished style.
      • Small design fixes for a cleaner, calmer study flow.
    bn: |-
      QuizBaaz ১.০.২২-এ যা নতুন:

      • চ্যাপ্টার সেট এখন আরও ঝরঝরে — Start ও Revise বাটন আরও বড়, পরিষ্কার ও সহজে চাপার মতো করা হয়েছে।
      • Start বাটন হালকা গ্লো নিয়ে চোখে পড়ে, পাশে Revise থাকে শান্ত tinted বাটন হিসেবে — আগে খেলুন, যেকোনো সময় পড়ুন।
      • History ট্যাবের Retry বাটনও একই পরিষ্কার স্টাইলে সাজানো হয়েছে।
      • পড়ার অভিজ্ঞতা আরও মসৃণ করতে ছোটখাটো ডিজাইন ঠিক করা হয়েছে।
    hi: |-
      QuizBaaz 1.0.22 में नया:

      • चैप्टर सेट अब और भी सहज — Start और Revise बटन अब बड़े, साफ़ और आसानी से दबाए जा सकते हैं।
      • Start बटन हल्की चमक के साथ सामने दिखता है, पास में Revise शांत tinted बटन के रूप में — पहले खेलें, कभी भी पढ़ें।
      • History टैब का Retry बटन भी इसी साफ़ स्टाइल में है।
      • पढ़ाई के अनुभव को सहज बनाने के लिए छोटे डिज़ाइन सुधार किए गए।
  "1.0.21":
    en: |-
      What's new in 1.0.21:

      • New Revise mode — open any chapter set as a read-only revision: every question with the correct answer highlighted and its explanation. Nothing is scored.
      • Guests can now sign in straight from the home screen to save and sync their progress — no need to open Profile.
      • Chhaya Prakashani Chemistry grew by 181 questions; the bank now holds 1,880 questions across 48 chapters.
    bn: |-
      QuizBaaz ১.০.২১-এ যা নতুন:

      • নতুন রিভাইজ মোড — যেকোনো চ্যাপ্টার সেট পড়ার মোডে খুলুন: প্রতিটি প্রশ্নের সঠিক উত্তর হাইলাইট করা থাকে, সঙ্গে ব্যাখ্যা। কিছুই স্কোর হয় না।
      • গেস্টরা এখন হোম স্ক্রিন থেকেই সাইন-ইন করে অগ্রগতি সেভ ও সিঙ্ক করতে পারবেন — প্রোফাইলে যাওয়ার দরকার নেই।
      • ছায়া প্রকাশনী রসায়নে ১৮১টি নতুন প্রশ্ন যোগ হয়েছে; ব্যাঙ্কে এখন ৪৮টি চ্যাপ্টারে ১,৮৮০টি প্রশ্ন।
    hi: |-
      QuizBaaz 1.0.21 में नया:

      • नया रिवाइज़ मोड — किसी भी चैप्टर सेट को सिर्फ़ पढ़ने के मोड में खोलें: हर सवाल के सही उत्तर हाइलाइट और उसका स्पष्टीकरण। कुछ भी स्कोर नहीं होता।
      • गेस्ट अब होम स्क्रीन से ही साइन-इन कर अपनी प्रगति सेव और सिंक कर सकते हैं — प्रोफ़ाइल पर जाने की ज़रूरत नहीं।
      • छाया प्रकाशनी रसायन में 181 नए प्रश्न जुड़े; बैंक में अब 48 चैप्टरों में 1,880 प्रश्न हैं।
  "1.0.20":
