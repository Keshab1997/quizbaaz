  "1.0.15":
    en: |-
      What's new:

      • Create a complete subject and its chapters with AI from Chapter Manager.
      • Add chapters to an existing subject with the AI syllabus assistant.
      • Review and select AI-generated English, Bangla and Hindi titles and descriptions.
      • Duplicate chapters and incomplete translations are caught before saving.
      • Subject and chapter updates are saved together for safer authoring.
    bn: |-
      QuizBaaz ১.০.১৫-এ যা নতুন:

      • Chapter Manager থেকে এখন AI-এর সাহায্যে পুরো subject ও তার chapter তৈরি করা যাবে।
      • Existing subject-এ নতুন chapter যোগ করার জন্য AI syllabus assistant ব্যবহার করুন।
      • Save করার আগে AI তৈরি করা English, বাংলা ও Hindi title এবং description দেখে বেছে নিন।
      • Duplicate chapter ও অসম্পূর্ণ translation save হওয়ার আগেই ধরা পড়বে।
      • Subject ও chapter-এর পরিবর্তন একসঙ্গে নিরাপদে save হবে।

      QuizBaaz-এর সঙ্গে শিখুন, এগিয়ে যান!
    hi: |-
      इस अपडेट में नया:

      • Chapter Manager से AI की मदद से subject और chapters बनाएँ।
      • मौजूदा subject में नए chapters के लिए AI syllabus assistant का उपयोग करें।
      • Save से पहले English, Bangla और Hindi titles और descriptions review करें।
      • Duplicate chapters और अधूरे translations save होने से पहले रुकते हैं।
      • Subject और chapter changes एक साथ सुरक्षित रूप से save होते हैं।
  "1.0.13":
    en: |-
      What's new in this update:

      • More time to think — every question now gets 30 seconds (up from 15), in daily quizzes, chapter sets and battles.
      • The question and all 4 options fit on one screen — no more scrolling mid-question.
      • The daily quiz banner now appears once on the first question, then gets out of your way.
      • Profile avatars no longer clip the top of your head.
      • Bangla and Hindi: no more English line repeated under the question.

      Enjoying QuizBaaz? Rate us on the Play Store!
    bn: |-
      এই আপডেটে যা নতুন:

      • ভাবার সময় বাড়ল — এখন প্রতি প্রশ্নে ৩০ সেকেন্ড (আগে ছিল ১৫), ডেইলি কুইজ, চ্যাপ্টার সেট ও ব্যাটল সবখানেই।
      • প্রশ্ন আর চারটি অপশন এবার এক স্ক্রিনেই — মাঝপ্রশ্নে আর স্ক্রল করতে হবে না।
      • ডেইলি কুইজের ব্যানার এখন শুধু প্রথম প্রশ্নে দেখাবে, তারপর পথ ছেড়ে দেবে।
      • প্রোফাইল অ্যাভাটারে আর মাথার উপরের অংশ কাটা পড়বে না।
      • বাংলা ও হিন্দিতে প্রশ্নের নিচে আর ইংরেজি লাইন দেখাবে না।

      QuizBaaz ভালো লাগছে? Play Store-এ একটা রেটিং দিলে আমাদের দিনটাই হয়ে যায়!
    hi: |-
      इस अपडेट में क्या नया है:

      • सोचने के लिए ज़्यादा वक़्त — अब हर सवाल के 30 सेकंड (पहले थे 15), डेली क्विज़, चैप्टर सेट और बैटल तीनों में।
      • सवाल और चारों विकल्प अब एक ही स्क्रीन पर — बीच में स्क्रॉल नहीं करना पड़ेगा।
      • डेली क्विज़ का बैनर अब सिर्फ़ पहले सवाल पर दिखेगा, फिर रास्ता छोड़ देगा।
      • प्रोफ़ाइल अवतार में अब सिर का ऊपरी हिस्सा नहीं कटेगा।
      • बंगाली और हिन्दी में सवाल के नीचे अब अंग्रेज़ी लाइन नहीं दिखेगी।

      QuizBaaz पसंद आया? Play Store पर रेटिंग देकर हमारा दिन बना दीजिए!
  "1.0.12":
    en: |-
      • 30 seconds per question now, up from 15 — daily quiz, chapter sets and battles
      • Question and all four options fit on one screen — no scrolling mid-question
      • The daily quiz banner shows on question 1, then gets out of the way
      • Profile avatar no longer clips the top of your head
